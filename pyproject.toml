[project]
name = "myproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ShristiSemantic", email = "shristi@semantic.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "dotenv>=0.9.9",
    "drf-spectacular>=0.30.0",
    "pillow>=12.3.0",
    "pip>=26.2.1",
    "psycopg2>=2.9.13",
]

[project.scripts]
myproject = "myproject:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
